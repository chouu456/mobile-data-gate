<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I Love You Darling</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 182, 193, 0.45), transparent 45%),
        radial-gradient(circle at 80% 75%, rgba(251, 113, 133, 0.25), transparent 50%),
        linear-gradient(160deg, #fff5f7 0%, #ffe4e9 52%, #ffd6e0 100%);
      font-family: 'Cormorant Garamond', Georgia, serif;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.55), transparent 65%);
      pointer-events: none;
    }

    .card {
      position: relative;
      max-width: 520px;
      width: 100%;
      padding: 48px 32px;
      border-radius: 28px;
      text-align: center;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow:
        0 24px 60px rgba(190, 24, 93, 0.14),
        0 4px 16px rgba(244, 63, 94, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      animation: revealCard 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 21px;
      border: 1px solid rgba(225, 29, 72, 0.12);
      pointer-events: none;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7.5vw, 46px);
      font-weight: 600;
      font-style: italic;
      line-height: 1.45;
      letter-spacing: 0.01em;
      color: #9f1239;
      text-shadow: 0 2px 14px rgba(225, 29, 72, 0.12);
      word-break: break-word;
    }

    @keyframes revealCard {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>I love you darling 💕💕💕💕💕💕💕😚😚😚😚😚😚😚</h1>
  </main>
</body>
</html>
