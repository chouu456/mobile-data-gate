<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I Love You Darling</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100dvh;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      padding: 20px;
      position: relative;
      background:
        radial-gradient(circle at 15% 18%, rgba(255, 138, 168, 0.42), transparent 42%),
        radial-gradient(circle at 86% 22%, rgba(244, 63, 94, 0.24), transparent 45%),
        radial-gradient(circle at 78% 84%, rgba(255, 182, 193, 0.55), transparent 48%),
        radial-gradient(circle at 22% 82%, rgba(251, 113, 133, 0.28), transparent 45%),
        linear-gradient(155deg, #fff0f4 0%, #ffdbe4 50%, #ffc8d6 100%);
    }

    /* Soft ambient bokeh circles filling the whole viewport */
    .orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(8px);
      animation: drift 9s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 240px;
      height: 240px;
      top: -50px;
      left: -40px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.55), rgba(251, 113, 133, 0.12));
    }

    .orb-2 {
      width: 300px;
      height: 300px;
      bottom: -80px;
      right: -60px;
      background: radial-gradient(circle, rgba(255, 241, 245, 0.5), rgba(225, 29, 72, 0.14));
      animation-delay: -3s;
    }

    .orb-3 {
      width: 170px;
      height: 170px;
      top: 16%;
      right: -35px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.45), rgba(244, 63, 94, 0.08));
      animation-delay: -5s;
    }

    .orb-4 {
      width: 190px;
      height: 190px;
      bottom: 18%;
      left: -45px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.45), rgba(244, 63, 94, 0.1));
      animation-delay: -7s;
    }

    /* Decorative full-frame border around the entire screen */
    .page-frame {
      position: fixed;
      inset: 12px;
      border-radius: 26px;
      border: 1.5px solid rgba(190, 18, 60, 0.22);
      box-shadow: inset 0 0 40px rgba(255, 255, 255, 0.45);
      pointer-events: none;
    }

    .page-frame::before {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 21px;
      border: 1px dashed rgba(190, 18, 60, 0.2);
      pointer-events: none;
    }

    .stage {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 560px;
      padding: 46px 28px;
      border-radius: 28px;
      text-align: center;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.78), rgba(255, 245, 248, 0.62));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow:
        0 24px 65px rgba(159, 18, 57, 0.16),
        0 6px 20px rgba(225, 29, 72, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      animation: popIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7.6vw, 46px);
      line-height: 1.48;
      color: #9f1239;
      word-break: break-word;
    }

    .phrase {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600;
      font-style: italic;
      letter-spacing: 0.01em;
      text-shadow: 0 2px 14px rgba(225, 29, 72, 0.14);
    }

    .emojis {
      font-family: system-ui, -apple-system, sans-serif;
      font-style: normal;
      font-weight: normal;
      letter-spacing: 0;
    }

    @keyframes drift {
      from {
        transform: translate(0, 0) scale(1);
      }
      to {
        transform: translate(14px, -16px) scale(1.08);
      }
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .orb, .stage {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
  <div class="page-frame"></div>

  <main class="stage">
    <h1><span class="phrase">I love you darling</span> <span class="emojis">💕💕💕💕💕💕💕😚😚😚😚😚😚😚</span></h1>
  </main>
</body>
</html>
