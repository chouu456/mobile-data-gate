<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I Love You Darling</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #fff1f2, #ffe4e6);
      color: #881337;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      text-align: center;
    }
    .box {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      border-radius: 20px;
      padding: 40px 28px;
      box-shadow: 0 12px 30px rgba(190, 18, 60, 0.14);
      border: 1px solid #fecdd3;
    }
    .emojis {
      font-size: 32px;
      margin-bottom: 14px;
      line-height: 1.4;
      word-break: break-word;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      color: #be123c;
    }
    p {
      margin: 0;
      font-size: 16px;
      color: #9f1239;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="emojis">💕💕💕💕💕💕💕😚😚😚😚😚😚😚</div>
    <h1>I love you darling</h1>
    <p>Unlocked on mobile data.</p>
  </div>
</body>
</html>
