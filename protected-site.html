<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I Love You Darling</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100dvh;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      padding: 20px;
      position: relative;
      background:
        radial-gradient(circle at 15% 18%, rgba(255, 138, 168, 0.42), transparent 42%),
        radial-gradient(circle at 86% 22%, rgba(244, 63, 94, 0.24), transparent 45%),
        radial-gradient(circle at 78% 84%, rgba(255, 182, 193, 0.55), transparent 48%),
        radial-gradient(circle at 22% 82%, rgba(251, 113, 133, 0.28), transparent 45%),
        linear-gradient(155deg, #fff0f4 0%, #ffdbe4 50%, #ffc8d6 100%);
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(8px);
      animation: drift 9s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 240px; height: 240px; top: -50px; left: -40px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.55), rgba(251, 113, 133, 0.12));
    }

    .orb-2 {
      width: 300px; height: 300px; bottom: -80px; right: -60px;
      background: radial-gradient(circle, rgba(255, 241, 245, 0.5), rgba(225, 29, 72, 0.14));
      animation-delay: -3s;
    }

    .orb-3 {
      width: 170px; height: 170px; top: 16%; right: -35px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.45), rgba(244, 63, 94, 0.08));
      animation-delay: -5s;
    }

    .orb-4 {
      width: 190px; height: 190px; bottom: 18%; left: -45px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.45), rgba(244, 63, 94, 0.1));
      animation-delay: -7s;
    }

    .page-frame {
      position: fixed;
      inset: 12px;
      border-radius: 26px;
      border: 1.5px solid rgba(190, 18, 60, 0.22);
      box-shadow: inset 0 0 40px rgba(255, 255, 255, 0.45);
      pointer-events: none;
    }

    .page-frame::before {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 21px;
      border: 1px dashed rgba(190, 18, 60, 0.2);
      pointer-events: none;
    }

    .stage {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 560px;
      padding: 42px 26px;
      border-radius: 28px;
      text-align: center;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.8), rgba(255, 245, 248, 0.65));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow:
        0 24px 65px rgba(159, 18, 57, 0.16),
        0 6px 20px rgba(225, 29, 72, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      animation: popIn 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .q-title {
      margin: 0 0 20px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 600;
      font-size: clamp(28px, 7vw, 38px);
      color: #9f1239;
      line-height: 1.3;
    }

    .q-title .emojis {
      font-family: system-ui, -apple-system, sans-serif;
      font-style: normal;
      font-weight: normal;
    }

    .ans-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1.5px solid rgba(190, 18, 60, 0.25);
      background: rgba(255, 255, 255, 0.92);
      color: #881337;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .ans-input:focus {
      border-color: #e11d48;
      box-shadow: 0 0 0 4px rgba(225, 29, 72, 0.12);
    }

    .submit-btn {
      margin-top: 14px;
      width: 100%;
      padding: 14px 18px;
      border-radius: 16px;
      border: 0;
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(190, 18, 60, 0.25);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .submit-btn:hover,
    .submit-btn:active {
      transform: translateY(-2px);
      box-shadow: 0 14px 26px rgba(190, 18, 60, 0.32);
    }

    .feedback {
      margin-top: 16px;
      min-height: 28px;
      font-family: system-ui, -apple-system, sans-serif;
      font-style: normal;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
      color: #be123c;
    }

    h1.final-msg {
      margin: 0;
      font-size: clamp(32px, 7.6vw, 46px);
      line-height: 1.48;
      color: #9f1239;
      word-break: break-word;
    }

    .phrase {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600;
      font-style: italic;
      letter-spacing: 0.01em;
      text-shadow: 0 2px 14px rgba(225, 29, 72, 0.14);
    }

    .emojis {
      font-family: system-ui, -apple-system, sans-serif;
      font-style: normal;
      font-weight: normal;
      letter-spacing: 0;
    }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(14px, -16px) scale(1.08); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(16px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
  <div class="page-frame"></div>

  <main class="stage" id="stage"></main>

  <script>
    const questions = [
      {
        q: "Ami ke hoi tomar",
        emoji: "🤔",
        answers: ["sona bor", "chuchoo"]
      },
      {
        q: "Tumi amar ke hao",
        emoji: "🤔",
        answers: ["sona bou", "dyno sona"]
      },
      {
        q: "password ki",
        emoji: "🤔",
        answers: ["swarnashikha"]
      }
    ];

    const RIGHT_REPLY = "\u{1F61A}\u{1F61A}\u{1F61A}\u{1F61A}\u{1F61A}\u{1F61A}\u{1F61A}"; // 7x 😚
    const WRONG_REPLY = "\u{1F97A}\u{1F97A}\u{1F97A} bhul , amake kissi dao";

    let step = 0;
    let locked = false;
    const stage = document.getElementById('stage');

    function normalize(val) {
      return val.trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function renderQuestion() {
      locked = false;
      const item = questions[step];
      stage.innerHTML = `
        <h2 class="q-title">${item.q} <span class="emojis">${item.emoji}</span></h2>
        <form id="q-form">
          <input
            id="ans-input"
            class="ans-input"
            type="text"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            placeholder="Type your answer..."
            required
          />
          <button type="submit" class="submit-btn">Submit</button>
        </form>
        <div class="feedback" id="feedback"></div>
      `;

      const form = document.getElementById('q-form');
      const input = document.getElementById('ans-input');
      const feedback = document.getElementById('feedback');
      input.focus();

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (locked) return;

        const guess = normalize(input.value);
        if (!guess) return;

        const isCorrect = item.answers.some((ans) => normalize(ans) === guess);

        if (isCorrect) {
          locked = true;
          feedback.textContent = RIGHT_REPLY;
          setTimeout(() => {
            step += 1;
            if (step < questions.length) {
              renderQuestion();
            } else {
              renderFinal();
            }
          }, 950);
        } else {
          feedback.textContent = WRONG_REPLY;
          input.value = '';
          input.focus();
        }
      });
    }

    function renderFinal() {
      stage.innerHTML = `
        <h1 class="final-msg"><span class="phrase">I love you darling</span> <span class="emojis">💕💕💕💕💕💕💕😚😚😚😚😚😚😚</span></h1>
      `;
    }

    renderQuestion();
  </script>
</body>
</html>
